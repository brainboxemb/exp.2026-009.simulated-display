name: Verify experiment

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configure native build
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release

      - name: Build native code
        run: cmake --build native/build --config Release

      - name: Test native code
        run: ctest --test-dir native/build -C Release --output-on-failure

      - name: Compile JavaFX application
        run: mvn -B -ntp verify
