[platformio]
default_envs = esp32dev

[env]
platform = espressif32@8.0.0
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#3.0.10
    https://github.com/lvgl/lvgl.git#v9.6.0
build_flags =
    -DNO_GFX=1
    -DPIXEL_COLOR_DEPTH_BITS=6
    -DLV_CONF_INCLUDE_SIMPLE
; Reuse native/ sources and minimal LVGL source filtering.
extra_scripts =
    pre:scripts/build_shared_native.py
    pre:scripts/lvgl_source_filter.py
build_src_filter =
    +<main.cpp>
    +<hub75_output.cpp>

[env:esp32dev]
board = esp32dev

[env:esp32doit-devkit-v1]
board = esp32doit-devkit-v1
