[platformio]
default_envs = esp32dev

[env]
platform = espressif32@8.0.0
framework = espidf
monitor_speed = 115200

; ESP-IDF components are declared through idf_component.yml, not lib_deps.
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -I../../native

; Default profile for a classic ESP32-WROOM-32 (no PSRAM).
[env:esp32dev]
board = esp32dev

; Optional profile for the DOIT-marked ESP32 DEVKIT V1 hardware.
[env:esp32doit-devkit-v1]
board = esp32doit-devkit-v1
